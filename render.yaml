databases:
  - name: ruta3b-db
    databaseName: ruta3b
    user: ruta3b
    plan: free

services:
  - type: web
    name: ruta3b-api
    runtime: python
    plan: free
    buildCommand: pip install pipenv && pipenv install
    startCommand: pipenv run gunicorn wsgi --chdir ./src/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ruta3b-db
          property: connectionString
      - key: FLASK_APP
        value: src/app.py
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
